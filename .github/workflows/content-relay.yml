name: Historia i kontrola automatu Cloudflare
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      request_check:
        description: 'Zleć sprawdzenie temu samemu automatowi Cloudflare'
        type: boolean
        default: false
      probe_tgg:
        description: 'Sprawdź transkrypcję TGG w trybie obserwacji, bez publikowania'
        type: boolean
        default: false
      inspect_candidate:
        description: 'Pokaż kandydat do publikacji bez cytatów i prywatnych materiałów źródłowych'
        type: boolean
        default: false
permissions:
  contents: write
  issues: write
concurrency:
  group: content-history
  cancel-in-progress: false
jobs:
  relay:
    if: vars.CONTENT_UPDATER_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      # Always run the protected default branch: workflow_dispatch must never
      # execute a caller-selected ref with write permissions and secrets.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - run: node scripts/github-relay.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          CONTENT_UPDATER_URL: ${{ vars.CONTENT_UPDATER_URL }}
          CONTENT_AUTOMATION_TOKEN: ${{ secrets.CONTENT_AUTOMATION_TOKEN }}
          BETA_SMOKE_CODE: ${{ secrets.BETA_SMOKE_CODE }}
          SMOKE_TEST_EMAIL: ${{ secrets.SMOKE_TEST_EMAIL }}
          REQUEST_CONTENT_CHECK: ${{ inputs.request_check && 'true' || 'false' }}
          PROBE_TGG: ${{ inputs.probe_tgg && 'true' || 'false' }}
          INSPECT_CANDIDATE: ${{ inputs.inspect_candidate && 'true' || 'false' }}
