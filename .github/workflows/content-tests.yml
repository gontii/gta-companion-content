name: Testy automatu treści
# Automatyczne testy main/PR wykonuje istniejąca VM GCP co godzinę.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: content-tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      # Tests use Node's built-in runner; no platform credentials or Worker deployment.
      - run: npm test
